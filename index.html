<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LEVEL 32: НАЧАЛО</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

@keyframes blinkRed{0%,100%{background:#0a0a0a}50%{background:#3a0a0a}}
@keyframes blinkYellow{0%,100%{background:#0a0a0a}50%{background:#3a320a}}
@keyframes blinkOrange{0%,100%{background:#0a0a0a}50%{background:#3a200a}}
@keyframes textBlink{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes popin{0%{transform:translateY(-30px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes sparkleFly{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-60px) scale(0)}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 10px rgba(212,197,160,.3)}50%{box-shadow:0 0 30px rgba(212,197,160,.9)}}
@keyframes fadeInUp{0%{opacity:0;transform:translateY(15px)}100%{opacity:1;transform:translateY(0)}}
@keyframes letterFly{0%{transform:scale(0) rotate(-180deg);opacity:0}60%{transform:scale(1.3) rotate(10deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes bossFlash{0%{background:#0a0a0a}20%{background:#fff}40%{background:#0a0a0a}60%{background:#d4c5a0}100%{background:#0a0a0a}}
@keyframes bossExplode{0%{transform:scale(1);opacity:1}100%{transform:scale(3);opacity:0}}
@keyframes dustFloat{0%{transform:translateY(100vh) translateX(0);opacity:0}10%{opacity:.6}90%{opacity:.6}100%{transform:translateY(-10vh) translateX(30px);opacity:0}}

body{background:#0a0a0a;color:#d4c5a0;font-family:'Courier New',monospace;min-height:100vh;display:flex;justify-content:center;padding:12px;transition:background .5s;position:relative;overflow-x:hidden}
body.critRed{animation:blinkRed 1.2s infinite}
body.critYellow{animation:blinkYellow 1.2s infinite}
body.critOrange{animation:blinkOrange 1.2s infinite}
body.shake{animation:shake .4s}
body.bossWin{animation:bossFlash 1s ease-out}

.box{width:100%;max-width:480px;background:#111;border:1px solid #2a2a2a;border-radius:4px;padding:16px;position:relative;transition:box-shadow .4s;z-index:2}
.box.critRed{border-color:#c44;box-shadow:0 0 30px rgba(200,60,60,.4)}
.box.critYellow{border-color:#cc4;box-shadow:0 0 30px rgba(200,200,60,.4)}
.box.critOrange{border-color:#c84;box-shadow:0 0 30px rgba(200,130,60,.4)}
.box.glow{animation:glowPulse 1s ease-in-out}
.box.fadeIn{animation:fadeInUp .5s ease-out}

h1{font-size:17px;letter-spacing:3px;text-align:center;margin-bottom:3px}
h2{font-size:12px;letter-spacing:4px;text-align:center;color:#d4c5a0;font-weight:normal;margin-bottom:2px}
.sub{font-size:8px;letter-spacing:3px;text-align:center;color:#5a4a3a;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid #2a2a2a}
.stat{font-size:10px;letter-spacing:1px;padding:6px 8px;background:#0d0d0d;border:1px solid #1f1f1f;border-radius:2px;margin-bottom:10px;color:#8a7a5a;text-align:center}
.stat b{color:#d4c5a0}
.stat .red{color:#ff3333;animation:textBlink .8s infinite}
.stat .yellow{color:#ffee44;animation:textBlink .8s infinite}
.stat .orange{color:#ff9944;animation:textBlink .8s infinite}
.bar{height:4px;background:#1a1a1a;border-radius:2px;overflow:hidden;margin-top:3px}
.bar>div{height:100%;transition:width .4s}
.p{font-size:12px;line-height:1.7;color:#b8a880;margin-bottom:8px}
.p b{color:#d4c5a0}
.p .red{color:#ff4444}
.p .grn{color:#8c8}
.p hr{border:none;border-top:1px dashed #2a2a2a;margin:8px 0}
.badge{display:inline-block;padding:2px 8px;border:1px solid #d4c5a0;color:#d4c5a0;font-size:8px;letter-spacing:2px;margin-bottom:8px}
.btn{display:block;width:100%;padding:12px;margin:6px 0;background:#1a1a1a;border:1px solid #3a3a3a;color:#d4c5a0;font-family:'Courier New',monospace;font-size:12px;letter-spacing:1px;cursor:pointer;border-radius:2px;text-align:center;transition:background .15s,transform .1s}
.btn:active{background:#2a2a2a;border-color:#d4c5a0;transform:scale(.98)}
.inp{width:100%;padding:11px;background:#0a0a0a;border:1px solid #3a3a3a;color:#d4c5a0;font-family:'Courier New',monospace;font-size:14px;text-align:center;letter-spacing:2px;border-radius:2px;outline:none;margin:8px 0}
.inp:focus{border-color:#d4c5a0}
.msg{padding:10px;margin:8px 0;border-radius:2px;font-size:11px;line-height:1.5;display:none}
.msg.err{display:block;background:rgba(180,40,40,.1);border:1px solid rgba(180,40,40,.4);color:#c44}
.msg.ok{display:block;background:rgba(80,160,80,.1);border:1px solid rgba(80,160,80,.4);color:#8c8}
.msg.info{display:block;background:rgba(212,197,160,.06);border:1px solid rgba(212,197,160,.25);color:#b8a880}
.final{font-size:13px;line-height:1.8;text-align:center;padding:10px 0}
.final .big{font-size:16px;letter-spacing:2px;margin:10px 0}
.final video{width:100%;border-radius:4px;margin:12px 0;border:1px solid #2a2a2a}
.letter{font-size:12px;line-height:1.7;text-align:left;padding:10px 4px;color:#c8b890}
.letter .head{font-size:14px;letter-spacing:2px;text-align:center;color:#d4c5a0;margin-bottom:10px}
.letter .center{text-align:center;font-size:14px;line-height:1.9}
.frag{display:inline-block;width:30px;height:30px;line-height:28px;text-align:center;border:1px solid #2a2a2a;border-radius:2px;margin:2px;font-size:14px;color:#2a2a2a;transition:all .3s}
.frag.on{border-color:#d4c5a0;color:#d4c5a0;animation:letterFly .6s ease-out,glowPulse 1.5s ease-in-out infinite}
.foot{text-align:center;padding-top:10px;border-top:1px solid #2a2a2a;margin-top:12px;font-size:8px;color:#4a3a2a;letter-spacing:2px}
.sms{position:fixed;top:10px;left:50%;transform:translateX(-50%);max-width:440px;width:calc(100% - 24px);background:#1a1a1a;border:1px solid #d4c5a0;border-radius:4px;padding:12px;z-index:999;animation:popin .5s;box-shadow:0 0 30px rgba(212,197,160,.3);cursor:pointer}
.sms .h{font-size:9px;color:#8a7a5a;letter-spacing:2px;margin-bottom:6px}
.sms .b{font-size:12px;line-height:1.6;color:#b8a880;margin-bottom:8px}
.sms .a{font-size:16px;color:#d4c5a0;text-align:center;letter-spacing:4px;font-weight:bold;padding:6px 0;border-top:1px dashed #2a2a2a;border-bottom:1px dashed #2a2a2a;margin:8px 0}
.sms .x{text-align:center;font-size:11px;color:#d4c5a0;cursor:pointer;padding-top:6px;border-top:1px dashed #2a2a2a;margin-top:6px;font-weight:bold}
.sms.ulyana{border-color:#8c8;box-shadow:0 0 30px rgba(140,200,140,.4)}
.sms.ulyana .h{color:#8c8}
.sms.achieve{border-color:#ffd700;box-shadow:0 0 30px rgba(255,215,0,.5);background:linear-gradient(135deg,#1a1a1a,#2a2418)}
.sms.achieve .h{color:#ffd700;font-weight:bold;letter-spacing:3px}
.sms.achieve .b{color:#ffe066}

.avatar{position:fixed;top:10px;right:10px;width:44px;height:44px;border-radius:50%;border:2px solid #d4c5a0;background:#111;color:#d4c5a0;font-family:'Courier New',monospace;font-size:20px;font-weight:bold;display:flex;align-items:center;justify-content:center;z-index:100;box-shadow:0 0 15px rgba(212,197,160,.4);animation:fadeInUp .5s ease-out;letter-spacing:0}

.dust{position:fixed;width:3px;height:3px;background:#d4c5a0;border-radius:50%;pointer-events:none;z-index:1;box-shadow:0 0 6px rgba(212,197,160,.8);animation-name:dustFloat;animation-timing-function:linear;animation-iteration-count:infinite}

.sparkle{position:fixed;pointer-events:none;font-size:20px;color:#d4c5a0;animation:sparkleFly .9s ease-out forwards;z-index:1000}

.bossBoom{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:80px;z-index:1000;pointer-events:none;animation:bossExplode 1s ease-out forwards}

.diary{background:rgba(212,197,160,.05);border:1px solid rgba(212,197,160,.2);border-left:3px solid #d4c5a0;padding:10px 12px;margin:10px 0;font-size:11px;line-height:1.7;color:#b8a880;font-style:italic;animation:fadeInUp .5s ease-out}
.diary .from{display:block;text-align:right;font-size:9px;color:#8a7a5a;font-style:normal;margin-top:6px;letter-spacing:2px}

.cert{border:3px double #d4c5a0;padding:20px;margin:15px 0;background:linear-gradient(135deg,rgba(212,197,160,.05),rgba(212,197,160,.02));text-align:center;position:relative}
.cert::before{content:'✦';position:absolute;top:5px;left:10px;color:#d4c5a0;font-size:12px}
.cert::after{content:'✦';position:absolute;bottom:5px;right:10px;color:#d4c5a0;font-size:12px}
.cert .title{font-size:10px;letter-spacing:4px;color:#8a7a5a;margin-bottom:10px}
.cert .name{font-size:18px;letter-spacing:3px;color:#d4c5a0;margin:10px 0;font-weight:bold}
.cert .sub{font-size:11px;color:#b8a880;line-height:1.6}
.cert .date{font-size:10px;color:#8a7a5a;margin-top:12px;letter-spacing:2px}

.inventory{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);max-width:480px;width:calc(100% - 24px);background:rgba(17,17,17,.95);border:1px solid #2a2a2a;border-radius:4px;padding:6px 10px;font-size:9px;color:#8a7a5a;letter-spacing:1px;display:flex;justify-content:space-around;flex-wrap:wrap;z-index:50;backdrop-filter:blur(4px)}
.inventory span{white-space:nowrap}
.inventory b{color:#d4c5a0}

.system-log{position:fixed;bottom:38px;left:50%;transform:translateX(-50%);max-width:480px;width:calc(100% - 24px);text-align:center;font-size:8px;color:#4a3a2a;letter-spacing:2px;font-family:'Courier New',monospace;z-index:49;pointer-events:none;opacity:0;transition:opacity .5s}
.system-log.show{opacity:1}
</style>
</head>
<body>
<div class="box" id="box">
<h1>LEVEL 32</h1>
<h2>НАЧАЛО</h2>
<div class="sub">MMORPG · ИГРА</div>
<div id="c"></div>
<div class="foot">LEVEL 32 · MMORPG</div>
</div>
<div class="system-log" id="systemLog"></div>
<div class="inventory" id="inventory"></div>
<script>
/* ============================================================
   ЗВУКИ
   ============================================================ */
var AudioCtx = window.AudioContext || window.webkitAudioContext;
var audioCtx = null;
function initAudio(){ if(!audioCtx && AudioCtx){ try{ audioCtx = new AudioCtx(); }catch(e){} } }
function playTone(freq, dur, type, vol){
  initAudio();
  if(!audioCtx) return;
  try{
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    g.gain.value = vol || 0.08;
    o.connect(g); g.connect(audioCtx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.stop(audioCtx.currentTime + dur);
  }catch(e){}
}
function playClick(){ playTone(880, 0.06, 'square', 0.05); }
function playBeep(){ playTone(180, 0.4, 'sawtooth', 0.12); setTimeout(function(){ playTone(180, 0.4, 'sawtooth', 0.12); }, 500); }
function playDing(){ playTone(1320, 0.2, 'sine', 0.1); setTimeout(function(){ playTone(1760, 0.3, 'sine', 0.08); }, 100); }
function playFanfare(){ var notes=[523,659,784,1047]; notes.forEach(function(n,i){ setTimeout(function(){ playTone(n,0.25,'triangle',0.1); }, i*120); }); }
function playError(){ playTone(220, 0.15, 'square', 0.08); setTimeout(function(){ playTone(180, 0.2, 'square', 0.08); }, 120); }
function playCrit(){ playTone(440, 0.15, 'sawtooth', 0.1); setTimeout(function(){ playTone(330, 0.15, 'sawtooth', 0.1); }, 200); setTimeout(function(){ playTone(440, 0.15, 'sawtooth', 0.1); }, 400); }
function playStep(){ playTone(120, 0.08, 'square', 0.04); setTimeout(function(){ playTone(100, 0.08, 'square', 0.03); }, 80); }
function playFragment(){
  playTone(1047, 0.15, 'sine', 0.1);
  setTimeout(function(){ playTone(1319, 0.15, 'sine', 0.1); }, 100);
  setTimeout(function(){ playTone(1568, 0.3, 'sine', 0.1); }, 200);
}
function playAchievement(){
  var notes = [659, 784, 988, 1319];
  notes.forEach(function(n, i){ setTimeout(function(){ playTone(n, 0.2, 'triangle', 0.12); }, i * 100); });
}
function playSave(){
  playTone(523, 0.15, 'sine', 0.1);
  setTimeout(function(){ playTone(784, 0.3, 'sine', 0.1); }, 150);
}

/* ============================================================
   АНИМАЦИИ
   ============================================================ */
function shakeScreen(){ document.body.classList.add('shake'); setTimeout(function(){ document.body.classList.remove('shake'); }, 400); }
function glowBox(){ box.classList.add('glow'); setTimeout(function(){ box.classList.remove('glow'); }, 1000); }
function fadeInBox(){ box.classList.add('fadeIn'); setTimeout(function(){ box.classList.remove('fadeIn'); }, 500); }
function sparkle(n){
  n = n || 8;
  for(var i = 0; i < n; i++){
    (function(i){
      setTimeout(function(){
        var s = document.createElement('div');
        s.className = 'sparkle';
        s.textContent = ['✦','✧','✩','★','☆'][Math.floor(Math.random()*5)];
        s.style.left = (window.innerWidth/2 + (Math.random()-0.5)*200) + 'px';
        s.style.top = (window.innerHeight/2 + (Math.random()-0.5)*100) + 'px';
        s.style.color = ['#d4c5a0','#ffddaa','#ffeecc','#c8b890'][Math.floor(Math.random()*4)];
        document.body.appendChild(s);
        setTimeout(function(){ s.remove(); }, 1000);
      }, i * 60);
    })(i);
  }
}

/* ============================================================
   АВАТАР, ПЫЛИНКИ, ИНВЕНТАРЬ, SYSTEM LOG
   ============================================================ */
function addAvatar(){
  if(document.getElementById('heroAvatar')) return;
  var a = document.createElement('div');
  a.id = 'heroAvatar';
  a.className = 'avatar';
  a.textContent = 'А';
  document.body.appendChild(a);
}
function addDust(){
  for(var i = 0; i < 15; i++){
    (function(i){
      setTimeout(function(){
        var d = document.createElement('div');
        d.className = 'dust';
        d.style.left = Math.random() * 100 + '%';
        d.style.animationDuration = (12 + Math.random() * 12) + 's';
        d.style.animationDelay = (Math.random() * 8) + 's';
        d.style.opacity = (0.3 + Math.random() * 0.5);
        document.body.appendChild(d);
      }, i * 400);
    })(i);
  }
}
function updateInventory(){
  var el = document.getElementById('inventory');
  if(!el) return;
  var fragCount = S.frag.length;
  var saved = S.save ? 1 : 0;
  var snkLeft = SNK_CODES.length - S.usedSnk.length;
  var pwrLeft = PWR_CODES.length - S.usedPwr.length;
  el.innerHTML = '<span>🍫 SNK: <b>'+snkLeft+'</b></span>'+
    '<span>🥤 PWR: <b>'+pwrLeft+'</b></span>'+
    '<span>🔑 ФРАГМЕНТЫ: <b>'+fragCount+'/5</b></span>'+
    '<span>💾 СОХР: <b>'+saved+'</b></span>';
}
var systemLogTimer = null;
function showSystemLog(text){
  var el = document.getElementById('systemLog');
  if(!el) return;
  el.textContent = 'SYSTEM LOG // ' + text;
  el.classList.add('show');
  if(systemLogTimer) clearTimeout(systemLogTimer);
  systemLogTimer = setTimeout(function(){ el.classList.remove('show'); }, 5000);
}

/* ============================================================
   ИГРА
   ============================================================ */
var c = document.getElementById('c');
var box = document.getElementById('box');
var S = {
  xp:0, hp:100, en:100, frag:[],
  critTimer:null, critSecs:0, critType:null,
  bossKills:0, save:null, currentFunc:null, nextFunc:null,
  inCrit:false, inBoss:false, usedSnk:[], usedPwr:[],
  startTime:Date.now(), errors:0, deaths:0, hintsUsed:0,
  achievements:[], hpRestored:0, enSpent:0, errorStreak:0,
  finalDone:false, heroName:'', heroClass:''
};
var bossTimer=null, bossSecs=600, bossHintShown=false;
var finalTimer=null, finalSecs=300, finalHintShown=false;
var L19err=0;
var bossErr=0;
var ulyanaTimer=null;
window._waitingForSms = false;
window._afterSms = null;

var SNK_CODES=['SNK-001','SNK-777','SNK-QW3','SNK-Z9X','SNK-KT5','SNK-MZ7','SNK-PL2','SNK-RD8','SNK-VN4','SNK-BG6'];
var PWR_CODES=['PWR-002','PWR-888','PWR-BR4','PWR-LP9','PWR-KT5'];

function goNext(name, ms){
  if(ulyanaTimer) clearTimeout(ulyanaTimer);
  S.nextFunc = name;
  S.transitioning = true;
  playStep();
  setTimeout(function(){
    S.transitioning = false;
    if(S.inCrit) return;
    var fn = window[name];
    S.nextFunc = null;
    if(typeof fn === 'function') fn();
    updateInventory();
  }, ms);
}
function checkCrit(){
  if(S.inBoss) return;
  if(S.transitioning) return;
  if((S.hp <= 20 || S.en <= 20) && !S.inCrit){ showCritScreen(); }
}
function hp(n){
  if(n > 0) S.hpRestored += n;
  S.hp = Math.max(0, Math.min(100, S.hp + n));
  setTimeout(checkCrit, 60);
  updateInventory();
}
function en(n){
  if(n < 0) S.enSpent += -n;
  S.en = Math.max(0, Math.min(100, S.en + n));
  setTimeout(checkCrit, 60);
  updateInventory();
}
function xp(n){ S.xp += n; }
function fmt(s){ var m = Math.floor(s/60), ss = s%60; return (m<10?'0':'')+m+':'+(ss<10?'0':'')+ss; }
function norm(x){ return x.toUpperCase().replace(/[\s\-]/g,''); }

function hideSms(){
  var e = document.getElementById('sms');
  if(e) e.remove();
  window._waitingForSms = false;
  if(window._afterSms && typeof window._afterSms === 'function'){
    var fn = window._afterSms;
    window._afterSms = null;
    setTimeout(fn, 300);
  }
}
function showSms(text, answer){
  var old = document.getElementById('sms');
  if(old) old.remove();
  S.hintsUsed++;
  window._waitingForSms = true;
  var d = document.createElement('div');
  d.id = 'sms'; d.className = 'sms';
  d.innerHTML = '<div class="h">📡 ВХОДЯЩЕЕ СООБЩЕНИЕ · NPC «СВЕТА»</div><div class="b">'+text+'</div><div class="a">'+answer+'</div><div class="x">[ закрыть ]</div>';
  d.onclick = hideSms;
  document.body.appendChild(d);
}
function showSmsUlyana(text){
  var old = document.getElementById('sms');
  if(old) old.remove();
  window._waitingForSms = true;
  var d = document.createElement('div');
  d.id = 'sms'; d.className = 'sms ulyana';
  d.innerHTML = '<div class="h">📡 ВХОДЯЩЕЕ СООБЩЕНИЕ · NPC «УЛЬЯНА»</div><div class="b">'+text+'</div><div class="x">[ закрыть ]</div>';
  d.onclick = hideSms;
  document.body.appendChild(d);
}
function showSkillNotification(letter){
  var data = {
    'М': { name:'МУДРОСТЬ', type:'пассивный', effect:'Позволяет отличать главное от второстепенного. Снижает риск неверного выбора.', extra:'Активируется автоматически при принятии решений.' },
    'Я': { name:'ЯСНОСТЬ', type:'пассивный', effect:'Открывает скрытые объекты и невидимые тропы. Позволяет видеть то, что скрыто от других.', extra:'Радиус действия: личный. Время действия: постоянное.' },
    'Ь': { name:'МЯГКОСТЬ', type:'тихий, пассивный', effect:'Смягчает удары. Гасит конфликты. Работает незаметно, но без него всё становится резким.', extra:'Не требует энергии. Нельзя потерять.' },
    'С': { name:'СИЛА', type:'пассивный', effect:'Удерживает рейд в строю, когда тяжело. Не даёт союзникам пасть духом.', extra:'Активируется при критических ситуациях. Бонус к защите рейда: +50%.' },
    'Е': { name:'ЕСТЕСТВО', type:'пассивный', effect:'Позволяет быть собой. Снимает любые маски. Усиливает связь с союзниками.', extra:'Активируется постоянно. Нельзя потерять.' }
  };
  var s = data[letter];
  if(!s) return;
  playAchievement();
  var d = document.createElement('div');
  d.id = 'sms'; d.className = 'sms achieve';
  d.innerHTML = '<div class="h">✦ НОВЫЙ НАВЫК ПОЛУЧЕН</div>'+
    '<div class="b">'+
    '<b>НАЗВАНИЕ: '+s.name+'</b><br>'+
    'ТИП: '+s.type+'<br>'+
    'УРОВЕНЬ: 1<br><br>'+
    '▸ Эффект:<br>'+s.effect+'<br><br>'+
    '▸ '+s.extra+
    '</div>'+
    '<div class="x">[ закрыть ]</div>';
  d.onclick = hideSms;

function critCheck(){
  var x = norm(document.getElementById('a').value);
  var needHP = S.hp <= 20;
  var needEN = S.en <= 20;
  var gotHP = false, gotEN = false;
  var snk = null, pwr = null;
  for(var i = 0; i < SNK_CODES.length; i++){ if(norm(SNK_CODES[i]) === x){ snk = SNK_CODES[i]; break; } }
  for(var i = 0; i < PWR_CODES.length; i++){ if(norm(PWR_CODES[i]) === x){ pwr = PWR_CODES[i]; break; } }
  if(snk){
    if(S.usedSnk.indexOf(snk) >= 0){ err('❌ КОД УЖЕ ИСПОЛЬЗОВАН.'); return; }
    if(needHP){ S.hp = Math.min(100, S.hp + 50); S.usedSnk.push(snk); gotHP = true; S.hpRestored += 50; }
    else { err('❌ ЭТО НЕ ТО. ИЩИ ДАЛЬШЕ.'); return; }
  } else if(pwr){
    if(S.usedPwr.indexOf(pwr) >= 0){ err('❌ КОД УЖЕ ИСПОЛЬЗОВАН.'); return; }
    if(needEN){ S.en = Math.min(100, S.en + 50); S.usedPwr.push(pwr); gotEN = true; }
    else { err('❌ ЭТО НЕ ТО. ИЩИ ДАЛЬШЕ.'); return; }
  } else { err('❌ НЕВЕРНЫЙ КОД.'); return; }
  if(gotHP || gotEN){
    playDing();
    updateInventory();
    ok('✅ ПРЕДМЕТ АКТИВИРОВАН.');
    if(gotHP && S.hpRestored >= 50){
      unlockAchievement('hp50', 'ВТОРОЕ ДЫХАНИЕ', 'Восстановлено 50 HP.');
    }
    setTimeout(function(){
      clearCrit();
      var target = S.nextFunc || S.currentFunc;
      S.nextFunc = null;
      if(target && typeof window[target] === 'function'){ window[target](); }
      else { start(); }
    }, 1200);
  }
}

  var x = v('a').replace(/\s/g,'');
  var q = bossQ[bossIdx], good = false;
  for(var i = 0; i < q.a.length; i++){ if(x === q.a[i].replace(/\s/g,'')){ good = true; break; } }
  if(good){ bossErr = 0; bossIdx++; S.nextFunc='bossShow'; goNext('bossShow', 700); }
  else {
    bossErr++;
    var hint = '';
    if(bossErr >= 3){ hint = ' ПОДСКАЗКА: '+q.a[0].toUpperCase()+'.'; }
    if(dmg(30)){ bossDeath(); return; }
    err('❌ ОТКАЗ. −30 HP. HP: '+S.hp+'/100.'+hint);
  }
}

function bossRevive(){
  var x = v('a').replace(/\s/g,'');
  var qq = window._bossReviveQ, good = false;
